# Keep the Template's dependencies current: a weekly pull request per ecosystem,
# minor and patch updates grouped into one, which CI checks before anyone merges.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
