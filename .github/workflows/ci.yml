name: CI

on:
  push:
  pull_request:
  # Weekly, against the newest releases the version ranges allow, so a release
  # that breaks the Template shows up here before an agent's `bun create` meets it.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# The jobs run dependency code (`bun update` resolves fresh releases), so the
# token can only read, checkout keeps it out of .git/config, and each action is
# pinned to a commit (Dependabot moves the pin and its version comment).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun update
      - run: bun run check
      - run: bun run build
